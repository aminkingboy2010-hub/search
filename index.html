<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <a href="index.html">Search</a>
        <a href="image.html">Images</a>
        <a href="advanced.html">Advanced</a>
    </nav>

    <main class="main-content">
        <div class="logo-container">
            <h1 class="logo">Google</h1>
        </div>

        <form action="https://www.google.com/search" method="get" class="search-form">
            <input type="text" name="q" placeholder="Search Google or type a URL" autocomplete="off" autofocus>
            <div class="button-group">
                <button type="submit">Google Search</button>
                <button type="submit" name="btnI" value="1">I'm Feeling Lucky</button>
            </div>
        </form>
    </main>
</body>
</html>
