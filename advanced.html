<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Advanced Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <a href="index.html">Search</a>
        <a href="image.html">Images</a>
        <a href="advanced.html">Advanced</a>
    </nav>

    <div class="advanced-container">
        <h1 class="advanced-title">Advanced Search</h1>
        
        <form action="https://www.google.com/search" method="get" class="advanced-form">
            
            <div class="form-row">
                <label for="as_q">Find pages with</label>
                <input type="text" name="as_q" id="as_q" placeholder="all these words">
            </div>
            
            <div class="form-row">
                <label for="as_epq">None of these words:</label>
                <input type="text" name="as_epq" id="as_epq" placeholder="this exact word or phrase">
            </div>

            <div class="form-row">
                <label for="as_oq">Any of these words:</label>
                <input type="text" name="as_oq" id="as_oq" placeholder="any of these words">
            </div>

            <div class="form-row">
                <label for="as_nq">None of these words:</label>
                <input type="text" name="as_nq" id="as_nq" placeholder="none of these words">
            </div>

            <div class="form-row submit-row">
                <button type="submit" class="advanced-btn">Advanced Search</button>
            </div>
        </form>
    </div>
</body>
</html>
