<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Images</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <a href="index.html">Search</a>
        <a href="image.html">Images</a>
        <a href="advanced.html">Advanced</a>
    </nav>

    <main class="main-content">
        <div class="logo-container">
            <h1 class="logo" style="color: #4285F4; font-size: 70px;">Google Images</h1>
        </div>

        <form action="https://www.google.com/search" method="get" class="search-form">
            <!-- این خط به گوگل میگه که دنبال عکس بگرده -->
            <input type="hidden" name="tbm" value="isch">
            
            <input type="text" name="q" placeholder="Search Google Images" autocomplete="off" autofocus>
            <div class="button-group">
                <button type="submit">Image Search</button>
            </div>
        </form>
    </main>
</body>
</html>
